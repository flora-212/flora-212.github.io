    Projects:
      - name: AI-Driven Multi-Agent Frameworks for Adaptive Code Completion
        summary: Research on adaptive multi-agent systems for AI-assisted code completion and automated prompt engineering.
        highlights:
        - Evaluated cross-project adaptation and robustness of multi-agent code completion systems.
        - Developed prompt-fixing strategies and automated evaluation workflows.
        - Built a VSCode extension for Python-based GitHub Copilot interaction.
          start_date: 2025-08
          end_date: 2025-11

      - name: Enhancing MLLMs Reasoning via Difficulty-Aware Group Normalization
        summary: Research on improving multimodal large language model reasoning with difficulty-aware reinforcement learning strategies.
        highlights:
        - Designed difficulty-aware regrouping methods for RLVR training.
        - Evaluated performance across multimodal reasoning benchmarks.
        - Achieved consistent improvements over GRPO/DAPO baselines.
          start_date: 2025-06
          end_date: 2025-09

      - name: Knowledge-Enhanced Agents Based on RAG and Web Search in LLM
        summary: Developed knowledge-grounded LLM agents integrating retrieval-augmented generation and real-time web search.
        highlights:
        - Led implementation of the WebSearch subsystem with dual-agent architecture.
        - Developed plugins for Google Search, Google Scholar, and arXiv integration.
        - Enhanced retrieval and planning modules for grounded generation.
        start_date: 2024-04
        end_date: 2025-05


